const Q=[{"lecture": 1, "page": 13, "stem": "Реформу русского стихосложения в 1735 году начал…", "options": ["А.Д. Кантемир", "В.К. Тредиаковский", "М.В. Ломоносов", "А.П. Сумароков"], "translation": "1735年，特列季亚科夫斯基开始改革俄语诗歌格律。", "quote": "В 1735 он начал реформу стихосложения", "topic": "诗歌格律改革：谁先提出、谁发展", "explanation": "特列季亚科夫斯基1735年提出改革，把重音引入俄语诗律的讨论；罗蒙诺索夫后来发展并完成这场改革。苏马罗科夫是诗人、剧作家和首任职业剧院院长；康捷米尔以讽刺诗著称。不要把四人都混成改革的发起者。", "id": 1, "variant": 1, "answer": 1}, {"lecture": 1, "page": 14, "stem": "Реформу стихосложения, начатую Тредиаковским, завершил…", "options": ["М.В. Ломоносов", "А.П. Сумароков", "А.Д. Кантемир", "Г.Р. Державин"], "translation": "完成特列季亚科夫斯基所开始的诗歌格律改革的是罗蒙诺索夫。", "quote": "он завершил реформу стихосложения, начатую В.К. Тредиаковским", "topic": "格律改革与18世纪诗人", "explanation": "课件把“1735年开始”归给特列季亚科夫斯基，把“完成”归给罗蒙诺索夫。苏马罗科夫以戏剧、诗歌及剧院工作著称；德尔扎文是重要抒情诗人，康捷米尔以讽刺诗闻名。", "id": 2, "variant": 2, "answer": 0}, {"lecture": 1, "page": 17, "stem": "Первым директором открытого в 1756 году профессионального театра стал…", "options": ["Ф.Г. Волков", "А.П. Сумароков", "М.В. Ломоносов", "Д.И. Фонвизин"], "translation": "1756年开办的职业剧院的首任院长是苏马罗科夫。", "quote": "первым директором этого театра стал Сумароков (1756–1761)", "topic": "俄罗斯职业剧院", "explanation": "1756年彼得堡职业剧院成立：苏马罗科夫任首任院长，沃尔科夫领导演员团体。丰维津稍后创作《纨绔少年》；罗蒙诺索夫以科学、诗歌和格律改革著称，均不是该剧院的首任院长。", "id": 3, "variant": 3, "answer": 1}, {"lecture": 1, "page": 25, "stem": "Автором комедий «Бригадир» и «Недоросль» был…", "options": ["Д.И. Фонвизин", "И.А. Крылов", "А.П. Сумароков", "А.Н. Радищев"], "translation": "喜剧《旅长》和《纨绔少年》的作者是丰维津。", "quote": "автор первой русской комедии нравов - «Бригадир» (1769). Его следующая комедия – «Недоросль» (1782)", "topic": "喜剧作者辨认", "explanation": "丰维津的《旅长》和《纨绔少年》是18世纪喜剧。苏马罗科夫也是剧作家，兼首任剧院院长；克雷洛夫尤其以寓言闻名；拉季舍夫是《从彼得堡到莫斯科旅行记》的作者。", "id": 4, "variant": 1, "answer": 0}, {"lecture": 2, "page": 8, "stem": "В 1787–1789 годах «Детское чтение для сердца и разума» редактировали Карамзин и…", "options": ["Н.И. Новиков", "И.И. Дмитриев", "А.А. Петров", "В.А. Жуковский"], "translation": "1787—1789年，《儿童心智读物》由卡拉姆津和彼得罗夫共同编辑。", "quote": "В 1787-1789 журнал редактировали Карамзин и его друг Александр Андреевич Петров", "topic": "早期儿童刊物及合作者", "explanation": "1785—1786年诺维科夫出版这本儿童刊物；1787—1789年卡拉姆津与彼得罗夫共同编辑。德米特里耶夫是同代作家；茹科夫斯基是后来与卡拉姆津有文学关系的诗人，不是本题共同编辑。", "id": 5, "variant": 2, "answer": 2}, {"lecture": 3, "page": 5, "stem": "Фамилию Жуковский получил от…", "options": ["своего учителя Н.М. Карамзина", "усыновившего его А.Г. Жуковского", "своего отца А.И. Бунина", "своей матери Сальхи"], "translation": "茹科夫斯基的姓氏来自收养他的安德烈·格里戈里耶维奇·茹科夫斯基。", "quote": "Фамилию получил от холостого дворянина Андрея Григорьевича Жуковского", "topic": "茹科夫斯基的家世", "explanation": "生父是布宁，母亲是萨尔哈；收养人的姓氏成为他的姓。卡拉姆津是支持其早期文学活动的重要前辈，与“姓氏来自谁”是两件事。", "id": 6, "variant": 3, "answer": 1}, {"lecture": 3, "page": 5, "stem": "Элегия «Сельское кладбище» Жуковского связана с произведением…", "options": ["Томаса Грея", "Джеймса Томсона", "Джорджа Байрона", "Лоренса Стерна"], "translation": "茹科夫斯基的《农村墓地》与托马斯·格雷的挽歌有关。", "quote": "«Сельское кладбище» (перевод элегии Т. Грея)", "topic": "文学翻译的源流", "explanation": "《农村墓地》是对英国诗人格雷挽歌的自由翻译。汤姆森写《四季》，其作品曾被卡拉姆津翻译；拜伦影响俄国浪漫主义，斯特恩的《感伤旅行》与卡拉姆津旅行文学有关。", "id": 7, "variant": 1, "answer": 0}, {"lecture": 3, "page": 15, "stem": "При переводе «Одиссеи» Жуковский пользовался…", "options": ["латинским стихотворным переводом", "только древнегреческим оригиналом", "немецким подстрочником", "французским подстрочником"], "translation": "茹科夫斯基翻译《奥德赛》时使用了德语逐字译本。", "quote": "Жуковский не знал древнегреческого языка и пользовался составленным для него немецким подстрочником", "topic": "《奥德赛》翻译方法", "explanation": "课件明确说茹科夫斯基不懂古希腊语，借助为他准备的德语逐字译本翻译；因此不能误以为他直接只依赖希腊原文。法语和拉丁语选项也不是课件说的中介语言。", "id": 8, "variant": 2, "answer": 2}, {"lecture": 4, "page": 3, "stem": "Найдите ЛИШНИЙ вариант среди элегий Жуковского, перечисленных на слайде.", "options": ["«Медный всадник»", "«Славянка»", "«Сельское кладбище»", "«Вечер»"], "translation": "找出课件所列茹科夫斯基挽歌中的多余项：《青铜骑士》。", "quote": "«Сельское кладбище» (1802, вольный перевод элегии Т. Грея)", "topic": "作品归属与“找出多余项”", "explanation": "《农村墓地》《黄昏》《斯拉夫扬卡》都列在茹科夫斯基新型挽歌的例子中；《青铜骑士》则是普希金的长诗。先辨作者与体裁，再处理“多余”这一否定要求。", "id": 9, "variant": 3, "answer": 0}, {"lecture": 4, "page": 3, "stem": "Для элегии нового типа у Жуковского характерны…", "options": ["историческое повествование о государственных деяниях", "героическая ода и прославление монарха", "вечерний пейзаж и меланхолическое настроение", "комическое изображение общественных нравов"], "translation": "茹科夫斯基的新型挽歌以黄昏景色和忧郁的情绪为特点。", "quote": "вечерним пейзажем и меланхолическим настроением", "topic": "感伤主义抒情方式", "explanation": "课件将新型挽歌与友情、爱情、记忆、黄昏景色和忧郁情绪联系起来。颂诗可以歌颂君主，喜剧可以描绘社会风俗，历史叙事可讲述国家事件；它们都不能准确概括此处的抒情特征。", "id": 10, "variant": 1, "answer": 2}, {"lecture": 5, "page": 10, "stem": "В «Горе от ума» общественный конфликт разворачивается между…", "options": ["Чацким и московским обществом", "Молчалиным и Скалозубом", "Софьей и Лизой", "Фамусовым и Репетиловым"], "translation": "《聪明误》的社会冲突发生在恰茨基和整个莫斯科社会之间。", "quote": "общественный конфликт – между Чацким и всем московским обществом", "topic": "爱情冲突与社会冲突", "explanation": "《聪明误》有恰茨基—索菲娅—莫尔恰林的爱情关系，但课件强调核心社会冲突是恰茨基与莫斯科社会的对立。其他人物之间也有关系，却不是这里提出的总体冲突。", "id": 11, "variant": 2, "answer": 0}, {"lecture": 5, "page": 10, "stem": "В основной любовный треугольник «Горя от ума» входят…", "options": ["Чацкий, Софья и Молчалин", "Молчалин, Лиза и Чацкий", "Фамусов, Софья и Репетилов", "Чацкий, Лиза и Скалозуб"], "translation": "《聪明误》的主要爱情三角包括恰茨基、索菲娅和莫尔恰林。", "quote": "главный любовный треугольник: Чацкий – Софья – Молчалин", "topic": "人物关系：爱情三角", "explanation": "索菲娅过去爱恰茨基，现在与莫尔恰林秘密来往。丽莎是侍女，斯卡洛祖布是潜在婚配人选；法穆索夫是索菲娅父亲，列彼季洛夫是另一人物，不能混入主要三角。", "id": 12, "variant": 3, "answer": 0}, {"lecture": 5, "page": 12, "stem": "Главный идейный антагонист Чацкого, защищающий устои патриархального дворянства, — …", "options": ["Платон Михайлович", "Фамусов", "Репетилов", "Молчалин"], "translation": "恰茨基的主要思想对手是维护宗法制贵族生活原则的法穆索夫。", "quote": "Фамусов - главный идейны антагонист Чацкого", "topic": "人物的思想立场", "explanation": "法穆索夫代表旧式莫斯科贵族秩序，是恰茨基的主要思想对手。莫尔恰林的顺从和沉默与恰茨基形成对照；列彼季洛夫、普拉东·米哈伊洛维奇也体现社会环境，但不是课件指定的主要对手。", "id": 13, "variant": 1, "answer": 1}, {"lecture": 5, "page": 17, "stem": "«Сон» Софьи в первом действии — это пародия на…", "options": ["бытовую повесть", "классическую оду", "романтическую балладу", "историческую хронику"], "translation": "索菲娅在第一幕讲述的“梦”是对浪漫主义叙事谣曲的戏仿。", "quote": "«Сон» Софьи (д.1, явл. 4) – пародия на романтическую балладу.", "topic": "体裁戏仿", "explanation": "课件把索菲娅的“梦”称为对浪漫主义叙事谣曲的戏仿。颂诗、历史编年剧和日常生活中篇小说都属于不同体裁，不能因为作品写到梦就混为一谈。", "id": 14, "variant": 2, "answer": 2}, {"lecture": 5, "page": 25, "stem": "Кульминация общественного конфликта связана с монологом Чацкого о…", "options": ["«веке минувшем»", "«французике из Бордо»", "службе в Персии", "княгине Марье Алексевне"], "translation": "社会冲突的高潮与恰茨基关于“波尔多来的法国小子”的独白有关。", "quote": "монолог Чацкого о «французике из Бордо»", "topic": "戏剧结构与讽刺对象", "explanation": "第三幕中关于“波尔多来的法国小子”的独白对应社会冲突高潮；“过去的世纪”与第二幕思想争论有关，玛丽娅公爵夫人出现在结尾法穆索夫的担忧中。波斯是作者经历，不是该独白的主题。", "id": 15, "variant": 3, "answer": 1}, {"lecture": 6, "page": 3, "stem": "К петербургскому периоду 1817–1820 годов относится поэма…", "options": ["«Руслан и Людмила»", "«Цыганы»", "«Полтава»", "«Медный всадник»"], "translation": "长诗《鲁斯兰与柳德米拉》属于普希金1817—1820年的彼得堡时期。", "quote": "Петербургский период (1817-1820) – политическая лирика, поэма «Руслан и Людмила»", "topic": "时期与作品", "explanation": "《鲁斯兰与柳德米拉》在彼得堡时期创作并于1820年出版；《茨冈》与米哈伊洛夫斯科耶时期有关，《波尔塔瓦》写于1828，《青铜骑士》写于1833。", "id": 16, "variant": 1, "answer": 0}, {"lecture": 6, "page": 3, "stem": "В Михайловском Пушкин написал трагедию…", "options": ["«Каменный гость»", "«Борис Годунов»", "«Моцарт и Сальери»", "«Пир во время чумы»"], "translation": "普希金在米哈伊洛夫斯科耶写下悲剧《鲍里斯·戈杜诺夫》。", "quote": "Михайловское (1824-1826) – поэма «Цыганы» (изд. 1827), трагедия «Борис Годунов»", "topic": "米哈伊洛夫斯科耶与悲剧", "explanation": "《鲍里斯·戈杜诺夫》于1825年写成、1831年出版；《莫扎特与萨列里》《石客》《瘟疫时期的宴会》属于1830年博尔季诺秋季的“小悲剧”。", "id": 17, "variant": 2, "answer": 1}, {"lecture": 7, "page": 9, "stem": "Герои поэмы «Кавказский пленник» названы в лекции…", "options": ["Сильвио и граф", "Мария и Зарема", "Пленник и Черкешенка", "Алеко и Земфира"], "translation": "课件中《高加索的俘虏》的主人公被称为俘虏和切尔克斯姑娘。", "quote": "герои поэмы – Пленник и Черкешенка (безымянные)", "topic": "作品与人物配对", "explanation": "《高加索的俘虏》中的俘虏与切尔克斯姑娘无姓名；阿列科和泽姆菲拉来自《茨冈》，玛丽娅和扎列玛来自《巴赫奇萨赖的喷泉》，西尔维奥和伯爵来自《射击》。", "id": 18, "variant": 3, "answer": 2}, {"lecture": 7, "page": 10, "stem": "Героини «Бахчисарайского фонтана» — …", "options": ["Мария и Зарема", "Марья Гавриловна и Лиза", "Земфира и Татьяна", "Людмила и Светлана"], "translation": "《巴赫奇萨赖的喷泉》的女主人公是玛丽娅和扎列玛。", "quote": "Герои поэмы – Мария и Зарема", "topic": "长诗的人物配对", "explanation": "玛丽娅与扎列玛是《巴赫奇萨赖的喷泉》人物；泽姆菲拉属于《茨冈》，塔季扬娜属于《奥涅金》，柳德米拉属于《鲁斯兰与柳德米拉》，斯韦特兰娜与茹科夫斯基谣曲相关。", "id": 19, "variant": 1, "answer": 0}, {"lecture": 7, "page": 15, "stem": "Стихотворение «К морю» в лекции связано с прощанием Пушкина с…", "options": ["реализмом", "классицизмом", "сентиментализмом", "романтизмом"], "translation": "课件将《致大海》与普希金告别浪漫主义联系起来。", "quote": "Прощание Пушкина с романтизмом.", "topic": "浪漫主义与文学转向", "explanation": "课件将《致大海》称为对浪漫主义的告别，并联系拜伦之死。感伤主义强调感情，古典主义强调规范，现实主义关注社会现实；本题问的是课件所说被告别的方向。", "id": 20, "variant": 2, "answer": 3}, {"lecture": 8, "page": 4, "stem": "Историческая основа «Бориса Годунова», согласно лекции, взята из труда…", "options": ["М.В. Ломоносова", "Н.М. Карамзина", "С.М. Соловьёва", "В.Н. Татищева"], "translation": "课件指出，《鲍里斯·戈杜诺夫》的历史基础取自卡拉姆津的著作。", "quote": "Историческая основа трагедии взята из «Истории Государства Российского» Н.М. Карамзина", "topic": "历史来源：卡拉姆津与普希金", "explanation": "课件将《鲍里斯·戈杜诺夫》的历史依据归于卡拉姆津《俄罗斯国家史》；塔季谢夫、索洛维约夫、罗蒙诺索夫都与俄国历史研究有关，但不是本页指定的来源。", "id": 21, "variant": 3, "answer": 1}, {"lecture": 8, "page": 4, "stem": "При создании «Бориса Годунова» Пушкин в литературном отношении ориентировался на…", "options": ["оды и сатиры Державина", "комедии и басни Мольера", "романы и баллады Вальтера Скотта", "трагедии и исторические хроники Шекспира"], "translation": "普希金创作《鲍里斯·戈杜诺夫》时，在文学上借鉴了莎士比亚的悲剧和历史剧。", "quote": "на трагедии и исторические хроники Шекспира", "topic": "莎士比亚与历史剧", "explanation": "课件区分历史材料来源（卡拉姆津）与文学形式参照（莎士比亚悲剧和历史剧）。莫里哀以戏剧喜剧闻名，司各特以历史小说闻名，德尔扎文是重要诗人；这些关系不能替换课件所指出的参照。", "id": 22, "variant": 1, "answer": 3}, {"lecture": 8, "page": 4, "stem": "Оперу «Борис Годунов» по трагедии Пушкина написал…", "options": ["М.П. Мусоргский", "М.И. Глинка", "П.И. Чайковский", "Н.А. Римский-Корсаков"], "translation": "根据普希金悲剧创作歌剧《鲍里斯·戈杜诺夫》的是穆索尔斯基。", "quote": "опера М.П. Мусоргского «Борис Годунов»", "topic": "文学作品与歌剧改编", "explanation": "穆索尔斯基根据普希金悲剧创作《鲍里斯·戈杜诺夫》歌剧。格林卡、柴可夫斯基、里姆斯基-科萨科夫都是重要作曲家；柴可夫斯基还创作过《叶甫盖尼·奥涅金》歌剧。", "id": 23, "variant": 2, "answer": 0}, {"lecture": 8, "page": 15, "stem": "«Арап Петра Великого» — это…", "options": ["неоконченный исторический роман", "законченная повесть о Пугачёве", "завершённая историческая трагедия", "поэма о Полтавской битве"], "translation": "《彼得大帝的黑奴》是一部未完成的历史小说。", "quote": "«Арап Петра Великого» (1827) – неоконченный исторический роман.", "topic": "历史题材与体裁", "explanation": "《彼得大帝的黑奴》是未完成历史小说；与波尔塔瓦战役相联系的长诗是《波尔塔瓦》，普加乔夫题材则包括《普加乔夫史》和《上尉的女儿》。", "id": 24, "variant": 3, "answer": 0}, {"lecture": 9, "page": 6, "stem": "Сильвио — главный герой повести…", "options": ["«Станционный смотритель»", "«Выстрел»", "«Метель»", "«Гробовщик»"], "translation": "西尔维奥是小说《射击》的主人公。", "quote": "«Выстрел» (главный герой – Сильвио", "topic": "人物与作品配对", "explanation": "西尔维奥与伯爵之间的决斗情节属于《射击》；《暴风雪》有玛丽娅·加夫里洛芙娜和布尔明，《棺材匠》有阿德里安，《驿站长》有萨姆松·维林和冬妮娅。", "id": 25, "variant": 1, "answer": 1}, {"lecture": 9, "page": 7, "stem": "Марья Гавриловна и гусар Бурмин — герои повести…", "options": ["«Метель»", "«Выстрел»", "«Станционный смотритель»", "«Барышня-крестьянка»"], "translation": "玛丽娅·加夫里洛芙娜和骠骑兵布尔明是小说《暴风雪》的人物。", "quote": "«Метель» (главные герои – Марья Гавриловна и гусар Бурмин).", "topic": "人物与作品配对", "explanation": "玛丽娅·加夫里洛芙娜和骠骑兵布尔明属于《暴风雪》；《射击》是西尔维奥，《小姐与女仆》是丽莎和阿列克谢，《驿站长》是维林、冬妮娅和明斯基。", "id": 26, "variant": 2, "answer": 0}, {"lecture": 9, "page": 9, "stem": "Адриан Прохоров — главный герой повести…", "options": ["«Выстрел»", "«Барышня-крестьянка»", "«Метель»", "«Гробовщик»"], "translation": "阿德里安·普罗霍罗夫是小说《棺材匠》的主人公。", "quote": "главный герой – гробовщик Адриан Прохоров", "topic": "人物与作品配对", "explanation": "阿德里安·普罗霍罗夫是棺材匠，属于同名小说；西尔维奥属于《射击》，玛丽娅与布尔明属于《暴风雪》，丽莎与阿列克谢属于《小姐与女仆》。", "id": 27, "variant": 3, "answer": 3}, {"lecture": 9, "page": 11, "stem": "Лиза, выдающая себя за крестьянку Акулину, — героиня…", "options": ["«Барышни-крестьянки»", "«Выстрела»", "«Метели»", "«Гробовщика»"], "translation": "假扮农家姑娘阿库琳娜的丽莎是《小姐与女仆》的女主人公。", "quote": "Лиза (она же крестьянка Акулина) и Алексей Берестов", "topic": "人物的双重身份", "explanation": "丽莎假扮农家姑娘阿库琳娜，与阿列克谢·别列斯托夫的故事属于《小姐与女仆》。其他三项同属《别尔金小说集》，但人物和情节不同。", "id": 28, "variant": 1, "answer": 0}, {"lecture": 10, "page": 7, "stem": "В 1833 году Пушкин начал работу над историей восстания…", "options": ["Разина", "Болотникова", "декабристов", "Пугачёва"], "translation": "1833年，普希金开始研究普加乔夫起义的历史。", "quote": "С февр. 1833 П. начал работу над историей восстания Пугачёва", "topic": "历史研究对象", "explanation": "普希金1833年开始研究普加乔夫起义，并前往相关地点；拉辛、博洛特尼科夫也是俄国历史上的起义领袖，十二月党人与1825年贵族革命运动有关。", "id": 29, "variant": 2, "answer": 3}, {"lecture": 10, "page": 9, "stem": "Сюжет поэмы «Анджело» восходит к драме Шекспира…", "options": ["«Король Лир»", "«Мера за меру»", "«Отелло»", "«Гамлет»"], "translation": "长诗《安杰洛》的情节取材于莎士比亚的戏剧《一报还一报》。", "quote": "поэма на сюжет драмы Шекспира «Мера за меру»", "topic": "莎士比亚戏剧的改编", "explanation": "《安杰洛》取材于莎士比亚《一报还一报》；《哈姆雷特》《奥赛罗》《李尔王》也是莎士比亚戏剧，却不是该长诗的课件所列来源。", "id": 30, "variant": 3, "answer": 1}, {"lecture": 10, "page": 14, "stem": "Сюжет «Сказки о рыбаке и рыбке» связан со сказкой…", "options": ["«О золотом петушке»", "«О мёртвой царевне»", "«О рыбаке и его жене»", "«О царе Салтане»"], "translation": "《渔夫和金鱼的故事》的情节与童话《渔夫和他的妻子》有关。", "quote": "Сюжет - из сказк
