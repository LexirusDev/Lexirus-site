 / '+all.length;document.getElementById('wrong').textContent=onlyWrong?'显示全部':'只看错题';let list=onlyWrong?all.filter(q=>state.a[q.id]!==q.answer):all;main.replaceChildren();if(!list.length)main.append(el('p','本套没有错题。','empty'));for(const q of list){let card=el('section',undefined,'q'+(done?(state.a[q.id]===q.answer?' good':' bad'):''));card.append(el('div','第 '+(all.indexOf(q)+1)+' 题 · 课件 '+String(q.lecture).padStart(2,'0'),'meta'),el('p',q.stem,'stem'));q.options.forEach((o,i)=>{let label=el('label',undefined,'option'),input=el('input');input.type='radio';input.name='q'+q.id;input.value=i;input.checked=state.a[q.id]===i;input.disabled=done;input.onchange=()=>{state.a[q.id]=i;save();document.getElementById('score').textContent='已答 '+all.filter(x=>state.a[x.id]!==undefined).length+' / '+all.length};label.append(input,document.createTextNode(letters[i]+') '+o));card.append(label)});if(done){let box=el('div',undefined,'result');box.append(el('strong',(state.a[q.id]===q.answer?'✓ 正确':'正确答案')+'：'+letters[q.answer]+') '+q.options[q.answer]),el('p','整句翻译：'+q.translation),el('p','课件原文：'+q.quote,'quote'),el('div','出处：课件 '+String(q.lecture).padStart(2,'0')+' · PDF 第 '+q.page+' 页','source'));card.append(box)}main.append(card)}}select.onchange=()=>{v=+select.value;onlyWrong=false;render();window.scrollTo(0,0)};document.getElementById('submit').onclick=()=>{if(state.done[v])return;let missing=Q.filter(q=>q.variant===v&&state.a[q.id]===undefined).length;if(missing&&!confirm('还有 '+missing+' 题未答，将按错误计入。确定交卷？'))return;state.done[v]=true;save();render()};document.getElementById('wrong').onclick=()=>{if(!state.done[v]){alert('交卷后可以筛选错题。');return}onlyWrong=!onlyWrong;render()};document.getElementById('reset').onclick=()=>{if(!confirm('确定清除本套进度并重新作答？'))return;Q.filter(q=>q.variant===v).forEach(q=>delete state.a[q.id]);delete state.done[v];onlyWrong=false;save();render()};document.getElementById('print').onclick=()=>window.print();render();
