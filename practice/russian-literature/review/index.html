<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>俄罗斯文学经典 · 整体复习</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5ef;color:#233432;font:17px/1.65 system-ui,-apple-system,sans-serif}header{background:#153e39;color:white;padding:32px max(20px,calc((100vw - 900px)/2))}header h1{margin:4px 0;font-size:clamp(27px,5vw,38px)}header p{margin:4px 0;color:#d7e8e0}a{color:#206558}header a{color:#fff}.wrap{max-width:900px;margin:auto;padding:0 18px 70px}nav{position:sticky;top:0;z-index:2;background:#f3f5ef;padding:12px 0;border-bottom:1px solid #cad6ca;display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,button,select{font:inherit;border:1px solid #becdc1;background:white;border-radius:8px;padding:9px;min-height:44px;color:#214b40}input{flex:1;min-width:160px}.intro{color:#567064;font-size:14px}.chapter{padding:24px 0;border-bottom:1px solid #cedacf;scroll-margin-top:125px}.number{color:#568072;font-size:13px;letter-spacing:.12em}.chapter h2{font-size:24px;margin:3px 0}.chapter>p{margin:2px 0 14px;color:#526860}details{background:#fff;border-bottom:1px solid #dce5dc;padding:0 16px}details:first-of-type{border-radius:9px 9px 0 0}details:last-of-type{border-radius:0 0 9px 9px}summary{cursor:pointer;padding:14px 0;font-weight:650}details p{margin:0 0 10px}.source{font-size:13px;color:#5c7468}.done{display:flex;gap:8px;margin-top:18px;align-items:center}.done input{flex:none;min-width:auto;min-height:auto;accent-color:#206558}.empty{padding:30px 0}.hidden{display:none}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #b88337;outline-offset:2px}@media(max-width:600px){nav select{width:100%}.chapter h2{font-size:21px}}</style></head><body><header><small>КПВ3 · 课程复习</small><h1>俄罗斯文学经典</h1><p>按课件梳理作品、人物与思想</p><a href="../">去做新版模拟题 →</a></header><div class="wrap"><nav aria-label="复习导航"><select id="jump" aria-label="选择章节"><option value="">选择章节</option></select><input id="search" type="search" placeholder="搜索人物、作品或考点" aria-label="搜索复习内容"><span id="progress" role="status"></span></nav><p class="intro">点击标题展开知识点，读完后标记章节。进度仅保存在当前浏览器。课程范围以老师通知为准。</p><main id="main"></main><p id="empty" class="empty hidden">没有找到相关内容，试试人物或作品的其他名称。</p></div><script>const C=[["01", "十八世纪：文学与启蒙", "课程以18世纪文学革新为起点，先抓住文体、制度和代表人物之间的联系。", [["格律改革：谁先、谁后", "特列季亚科夫斯基开始改革俄语诗歌格律，罗蒙诺索夫发展并完成改革。考试问“开始”还是“完成”，答案不同。", "课件 01 · 第 13、14 页"], ["剧场与喜剧", "苏马罗科夫是第一所职业剧院的首任院长，沃尔科夫领导演员团体。丰维津的《旅长》《纨绔少年》则是喜剧的重要例子。", "课件 01 · 第 17、25 页"], ["讽刺、抒情与旅行", "康捷米尔与讽刺诗相关；德尔扎文以抒情诗著称；拉季舍夫写《从彼得堡到莫斯科旅行记》。把人物、体裁和作品连起来记。", "课件 01 · 第 12、21、26 页"]]], ["02", "卡拉姆津：旅行、感情与历史", "卡拉姆津同时是作家、翻译家、出版者和历史学家。把他的作品与立场放在一起读。", [["感伤旅行：情感组织全书", "《一个俄国旅行者的来信》兼有见闻、文化观察与个人感受。旅行者的形象赋予全书内在统一，他追求印象，也向读者传达自己的心情。", "课件 02 · 第 9 页"], ["《可怜的丽莎》与《娜塔莉娅》", "课件将《可怜的丽莎》的悲剧故事，与《波雅尔的女儿娜塔莉娅》中地位悬殊的恋人获得幸福结局作对照。读题时先辨作品，再判断结局。", "课件 02 · 第 18、21、22 页"], ["出版与文学趣味", "《莫斯科杂志》发表文学作品并传播“良好趣味”；《我的小玩意儿》以谦逊标题表达作者分享思想与感情的姿态。", "课件 02 · 第 17、23 页"], ["哥特小说与对卢梭的回应", "《谢拉-莫雷纳》《博恩霍尔姆岛》借用恐怖与神秘主题。《我的忏悔》戏仿卢梭《忏悔录》，课件将其视为对人性天生善良观念的反驳。", "课件 02 · 第 24、25 页"], ["历史观与政体", "课件对《玛尔法女市长》的解释强调君主制的可靠性，并与诺夫哥罗德共和国的命运对照。《俄罗斯国家史》则是卡拉姆津晚年的大型历史著作。", "课件 02 · 第 26、28、29 页"]]], ["03", "茹科夫斯基：诗人、译者与教育者", "他的作品把欧洲文学翻译与个人诗风结合，也与1812年战争和宫廷教育有关。", [["《农村墓地》与格雷", "《农村墓地》是对英国诗人格雷挽歌的自由翻译。理解“改写”和“原作者”之间的关系，比孤立记住国别更有用。", "课件 03 · 第 5、6 页"], ["战争与诗歌", "1812年他加入民兵，《俄国战士营中的歌者》是对战争的重要诗歌回应。", "课件 03 · 第 7 页"], ["宫廷工作与《奥德赛》", "他曾教未来的亚历山德拉皇后俄语；晚年翻译荷马《奥德赛》时，使用为他准备的德语逐字译本。", "课件 03 · 第 9、15 页"]]], ["04", "茹科夫斯基：挽歌与叙事谣曲", "阅读时区分抒情的心灵世界、谣曲的情节和作品传入俄国后的变化。", [["挽歌：心灵与记忆", "新型挽歌把友情、爱情、记忆、黄昏景色和忧郁情绪结合起来。《农村墓地》《黄昏》《斯拉夫扬卡》是课件列举的例子。", "课件 04 · 第 3 页"], ["《大海》：风景也是象征", "课件将海与人并置：海的深渊、忧思及对天空的向往，映照人的内在世界。不要只把诗看成海景描写。", "课件 04 · 第 9 页"], ["《柳德米拉》与《斯韦特兰娜》", "《柳德米拉》改写毕尔格《莱诺拉》的亡灵新郎故事；《斯韦特兰娜》把可怕经历处理为一场梦，醒来后新郎平安归来。两部作品的结局和信仰态度不同。", "课件 04 · 第 12、14、16 页"], ["善恶与道德选择", "课件强调人在谣曲世界里要对善恶作选择，并将《斯韦特兰娜》的结尾与对天意的信赖联系起来。", "课件 04 · 第 14、16 页"]]], ["05", "格里鲍耶多夫与《聪明误》", "同时抓住爱情关系、社会冲突、人物立场和评论者的不同判断。", [["两条冲突线", "爱情三角是恰茨基、索菲娅、莫尔恰林；社会冲突则是恰茨基与莫斯科社会之间的矛盾。两条线相互交织。", "课件 05 · 第 9、10 页"], ["恰茨基、法穆索夫与莫尔恰林", "法穆索夫维护旧式贵族秩序，是主要思想对手；莫尔恰林的沉默与恰茨基的言说形成对照。", "课件 05 · 第 10、12 页"], ["舞台外人物与戏仿", "被提到却不登场的人物扩展了作品中的社会世界；索菲娅的“梦”则戏仿浪漫主义叙事谣曲。", "课件 05 · 第 8、17 页"], ["批评视角：普希金与阿尔塞斯特", "课件将恰茨基与莫里哀《恨世者》的阿尔塞斯特比较。普希金肯定恰茨基的高尚及其言语的聪明，同时怀疑他对听众的判断是否明智。", "课件 05 · 第 11、14 页"]]], ["06", "普希金：创作的整体脉络", "先用作品和创作阶段建立骨架，再在需要时补充年代。", [["从皇村中学到南方", "早期以抒情诗和《鲁斯兰与柳德米拉》为重要线索；南方时期涉及《高加索的俘虏》《巴赫奇萨赖的喷泉》，并开始《叶甫盖尼·奥涅金》。", "课件 06 · 第 2、3 页"], ["米哈伊洛夫斯科耶与后期", "这一时期与《茨冈》《鲍里斯·戈杜诺夫》有关；博尔季诺秋季则联系《别尔金小说集》、小悲剧和《奥涅金》的完成。", "课件 06 · 第 3 页"]]], ["07", "普希金：南方长诗与浪漫主义", "考查人物和作品配对时，注意每部作品的主人公及表现方向。", [["三组人物", "《高加索的俘虏》有无名的俘虏和切尔克斯姑娘；《巴赫奇萨赖的喷泉》有人物玛丽娅与扎列玛；《茨冈》有阿列科与泽姆菲拉。", "课件 07 · 第 9、10、16 页"], ["《致大海》", "课件将《致大海》视为普希金与浪漫主义告别的作品，并联系拜伦之死。", "课件 07 · 第 15 页"]]], ["08", "普希金：历史题材与莎士比亚", "历史材料来自哪里，与文学形式借鉴了谁，是两个不同问题。", [["《鲍里斯·戈杜诺夫》", "课件指出，历史依据来自卡拉姆津《俄罗斯国家史》，文学上参照莎士比亚的悲剧与历史剧。后来穆索尔斯基据此创作歌剧。", "课件 08 · 第 4 页"], ["彼得一世题材", "《波尔塔瓦》涉及彼得一世和马泽帕；《彼得大帝的黑奴》是未完成的历史小说。", "课件 08 · 第 13、15 页"]]], ["09", "普希金：《别尔金小说集》与小悲剧", "同一创作阶段出现不同体裁，复习时要把人物和作品配对。", [["五篇小说", "《射击》的西尔维奥；《暴风雪》的玛丽娅和布尔明；《棺材匠》的阿德里安；《驿站长》的维林和冬妮娅；《小姐与女仆》的丽莎与阿列克谢。", "课件 09 · 第 5 至 11 页"], ["另一组：小悲剧", "《莫扎特与萨列里》《石客》《吝啬骑士》《瘟疫时期的宴会》属于小悲剧，不属于《别尔金小说集》。", "课件 09 · 第 12 至 15 页"]]], ["10", "普希金：后期创作与国际联系", "关注文学作品的改写来源、历史研究和重要创作。", [["莎士比亚与《安杰洛》", "《安杰洛》的情节来自莎士比亚《一报还一报》；这是“原作与改写”的对应关系。", "课件 10 · 第 9 页"], ["历史与童话", "普希金研究普加乔夫起义；《渔夫和金鱼的故事》的故事来源与《渔夫和他的妻子》相关。", "课件 10 · 第 7、14 页"], ["《黑桃皇后》", "《黑桃皇后》是普希金后期的中篇小说，复习时可与别尔金五篇小说区分。", "课件 10 · 第 11 页"]]]];let seen;try{seen=JSON.parse(localStorage.getItem('kpv3-review-v1'))||{}}catch(e){seen={}}const main=document.querySelector('#main'),jump=document.querySelector('#jump'),progress=document.querySelector('#progress');function el(t,s){let e=document.createElement(t);if(s!==undefined)e.textContent=s;return e}function refresh(){progress.textContent='已读 '+Object.keys(seen).filter(k=>seen[k]).length+' / '+C.length}for(const [id,title,intro,items] of C){jump.add(new Option(id+' '+title,id));let section=el('section');section.className='chapter';section.id='chapter-'+id;let n=el('div',id+' / 课件');n.className='number';section.append(n,el('h2',title),el('p',intro));for(const [heading,body,source] of items){let d=el('details');d.append(el('summary',heading),el('p',body));let ref=el('p',source);ref.className='source';d.append(ref);section.append(d)}let label=el('label');label.className='done';let check=el('input');check.type='checkbox';check.checked=!!seen[id];check.onchange=()=>{if(check.checked)seen[id]=true;else delete seen[id];try{localStorage.setItem('kpv3-review-v1',JSON.stringify(seen))}catch(e){}refresh()};label.append(check,document.createTextNode(' 标记本章已读'));section.append(label);main.append(section)}jump.onchange=()=>{if(jump.value)document.getElementById('chapter-'+jump.value).scrollIntoView({behavior:'auto'})};document.querySelector('#search').oninput=e=>{const term=e.target.value.trim().toLowerCase();let count=0;document.querySelectorAll('.chapter').forEach(section=>{let hit=section.textContent.toLowerCase().includes(term);section.hidden=!hit;if(hit)count++;section.querySelectorAll('details').forEach(d=>{d.hidden=!!term&&!d.textContent.toLowerCase().includes(term)&&!section.querySelector('h2').textContent.toLowerCase().includes(term);if(term&&!d.hidden)d.open=true})});document.querySelector('#empty').classList.toggle('hidden',count>0)};refresh();</script></body></html>
