<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>俄罗斯文学经典 · 整体复习</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5ef;color:#233432;font:17px/1.65 system-ui,-apple-system,sans-serif}header{background:#153e39;color:white;padding:32px max(20px,calc((100vw - 900px)/2))}header h1{margin:4px 0;font-size:clamp(27px,5vw,38px)}header p{margin:4px 0;color:#d7e8e0}a{color:#206558}header a{color:#fff}.wrap{max-width:900px;margin:auto;padding:0 18px 70px}nav{position:sticky;top:0;z-index:2;background:#f3f5ef;padding:12px 0;border-bottom:1px solid #cad6ca;display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,button,select{font:inherit;border:1px solid #becdc1;background:white;border-radius:8px;padding:9px;min-height:44px;color:#214b40}input{flex:1;min-width:160px}.intro{color:#567064;font-size:14px}.chapter{padding:24px 0;border-bottom:1px solid #cedacf;scroll-margin-top:125px}.number{color:#568072;font-size:13px;letter-spacing:.12em}.chapter h2{font-size:24px;margin:3px 0}.chapter>p{margin:2px 0 14px;color:#526860}details{background:#fff;border-bottom:1px solid #dce5dc;padding:0 16px}details:first-of-type{border-radius:9px 9px 0 0}details:last-of-type{border-radius:0 0 9px 9px}summary{cursor:pointer;padding:14px 0;font-weight:650}details p{margin:0 0 10px}.source{font-size:13px;color:#5c7468}.done{display:flex;gap:8px;margin-top:18px;align-items:center}.done input{flex:none;min-width:auto;min-height:auto;accent-color:#206558}.empty{padding:30px 0}.hidden{display:none}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #b88337;outline-offset:2px}@media(max-width:600px){nav select{width:100%}.chapter h2{font-size:21px}}</style></head><body><header><small>КПВ3 · 课程复习</small><h1>俄罗斯文学经典</h1><p>按课件梳理作品、人物与思想</p><a href="../">去做新版模拟题 →</a></header><div class="wrap"><nav aria-label="复习导航"><select id="jump" aria-label="选择章节"><option value="">选择章节</option></select><input id="search" type="search" placeholder="搜索人物、作品或考点" aria-label="搜索复习内容"><span id="progress" role="status"></span></nav><p class="intro">点击标题展开知识点，读完后标记章节。进度仅保存在当前浏览器。课程范围以老师通知为准。</p><main id="main"></main><p id="empty" class="empty hidden">没有找到相关内容，试试人物或作品的其他名称。</p></div><script>const C=[["01", "十八世纪：文学与启蒙", "十八世纪俄罗斯文学中的诗歌格律、剧院、喜剧和讽刺。", [["俄语诗歌格律改革", "瓦西里·基里洛维奇·特列季亚科夫斯基（Василий Кириллович Тредиаковский）提出俄语诗歌格律改革（реформа русского стихосложения）。米哈伊尔·瓦西里耶维奇·罗蒙诺索夫（Михаил Васильевич Ломоносов）进一步发展了这项改革。课件将特列季亚科夫斯基称为俄语音步格律诗（силлабо-тоническое стихосложение）的开创者。音步格律诗同时考虑音节数量与重音的排列。", "课件 01 · 第 13、14 页"], ["俄罗斯职业剧院与喜剧", "1756 年，圣彼得堡（Санкт-Петербург）开设“俄罗斯悲剧与喜剧演出剧院”（Русский для представления трагедий и комедий театр），课件称其为俄罗斯第一所职业戏剧剧院（профессиональный драматический театр），即后来的亚历山德琳斯基剧院（Александринский театр）。首任院长（директор）是亚历山大·彼得罗维奇·苏马罗科夫（Александр Петрович Сумароков），演员团体由费奥多尔·格里戈里耶维奇·沃尔科夫（Фёдор Григорьевич Волков）领导。杰尼斯·伊万诺维奇·丰维津（Денис Иванович Фонвизин）写有风俗喜剧（комедия нравов）《旅长》（«Бригадир»）和喜剧《纨绔少年》（«Недоросль»）。", "课件 01 · 第 17、25 页"], ["讽刺诗、抒情诗与旅行记", "安季奥赫·德米特里耶维奇·康捷米尔（Антиох Дмитриевич Кантемир）以讽刺诗（сатира）著称，讽刺诗通过批评和嘲讽揭示人的缺点或社会问题。加夫里尔·罗曼诺维奇·德尔扎文（Гавриил Романович Державин）是重要的抒情诗人（лирический поэт），抒情诗（лирика）着重表现情感和思想。亚历山大·尼古拉耶维奇·拉季舍夫（Александр Николаевич Радищев）写有《从彼得堡到莫斯科旅行记》（«Путешествие из Петербурга в Москву»）。", "课件 01 · 第 12、21、26 页"]]], ["02", "卡拉姆津：旅行、感情与历史", "尼古拉·米哈伊洛维奇·卡拉姆津（Николай Михайлович Карамзин）是作家、翻译家、出版者和历史学家。", [["《一个俄国旅行者的来信》与感伤主义", "《一个俄国旅行者的来信》（«Письма русского путешественника»）结合欧洲旅行见闻、文化观察与作者情感。课件认为，旅行者形象（образ путешественника）使全书具有内在统一性。卡拉姆津重视感受和印象，使作品成为感伤主义（сентиментализм）旅行文学的代表。感伤主义关注人的情感和内心体验。", "课件 02 · 第 9 页"], ["《可怜的丽莎》与《娜塔莉娅，波雅尔之女》", "《可怜的丽莎》（«Бедная Лиза»）讲述丽莎（Лиза）和埃拉斯特（Эраст）的爱情悲剧。课件指出，《娜塔莉娅，波雅尔之女》（«Наталья, боярская дочь»）则以地位不平等的恋人获得幸福作为结局；波雅尔（боярин）是古罗斯的上层贵族。", "课件 02 · 第 18、21、22 页"], ["杂志与诗集", "卡拉姆津出版《莫斯科杂志》（«Московский журнал»），发表文学作品并传播“良好趣味”（хороший вкус）。他的诗集《我的小玩意儿》（«Мои безделки»）以谦逊的名称表明作者愿与读者分享思想和感情。", "课件 02 · 第 17、23 页"], ["哥特小说与卢梭", "《谢拉-莫雷纳》（«Сиерра-Морена»）和《博恩霍尔姆岛》（«Остров Борнгольм»）被课件归为哥特小说（готическая повесть），以恐怖、秘密和古堡为特征。《我的忏悔》（«Моя исповедь»）戏仿法国思想家让-雅克·卢梭（Жан-Жак Руссо）的《忏悔录》（«Исповедь»），课件指出它反驳人性天生善良的观念。", "课件 02 · 第 24、25 页"], ["《玛尔法女市长》与历史观", "《玛尔法女市长，或诺夫哥罗德的被征服》（«Марфа Посадница, или Покорение Новагорода»）描写莫斯科（Москва）征服诺夫哥罗德（Новгород）。课件认为，作品把专制君主制（самодержавие）表现为可靠的政体，将共和国（республика）描绘为不稳定的政体。《俄罗斯国家史》（«История Государства Российского»）是卡拉姆津晚年的历史著作。", "课件 02 · 第 26、28、29 页"]]], ["03", "茹科夫斯基：诗人、译者与教育者", "瓦西里·安德烈耶维奇·茹科夫斯基（Василий Андреевич Жуковский）是诗人和翻译家。", [["《农村墓地》与格雷", "《农村墓地》（«Сельское кладбище»）是对英国诗人托马斯·格雷（Томас Грей）挽歌的自由翻译（вольный перевод）。挽歌（элегия）是一种抒情诗体，常表达沉思、忧愁、失去或对人生的思考。", "课件 03 · 第 5、6 页"], ["卫国战争与诗歌", "1812 年卫国战争（Отечественная война 1812 года）初期，茹科夫斯基加入民兵（ополчение）。《俄国战士营中的歌者》（«Певец во стане русских воинов»）是他对战争的重要诗歌回应，课件将它称为颂歌（гимн）。", "课件 03 · 第 7 页"], ["宫廷教学与《奥德赛》", "茹科夫斯基曾为未来的皇后亚历山德拉·费奥多罗芙娜（Александра Фёдоровна）教授俄语。晚年翻译荷马（Гомер）的史诗（эпос）《奥德赛》（«Одиссея»）时，他不懂古希腊语，使用了为他准备的德语逐字译文（немецкий подстрочник）。", "课件 03 · 第 9、15 页"]]], ["04", "茹科夫斯基：挽歌与叙事谣曲", "挽歌（элегия）侧重抒情沉思；叙事谣曲（баллада）通过故事、人物和情节展开。", [["挽歌：心灵与记忆", "课件将茹科夫斯基的新型挽歌（элегия）与友情（дружба）、爱情（любовь）、记忆（память）、黄昏景色（вечерний пейзаж）和忧郁情绪（меланхолическое настроение）联系起来。作品包括《农村墓地》（«Сельское кладбище»）、《黄昏》（«Вечер»）和《斯拉夫扬卡》（«Славянка»）。", "课件 04 · 第 3 页"], ["《大海》：风景与象征", "在挽歌《大海》（«Море»）中，课件将海（море）与人的心灵（душа）并置。海的深渊、忧思和对天空（небо）的向往，映照人的内在世界。象征（символ）是在具体形象之外承载更广意义的表达。", "课件 04 · 第 9 页"], ["《柳德米拉》与《斯韦特兰娜》", "叙事谣曲《柳德米拉》（«Людмила»）自由改写德国诗人戈特弗里德·奥古斯特·毕尔格（Готфрид Август Бюргер）的《莱诺拉》（«Ленора»），沿用死去的新郎（мёртвый жених）带走新娘的故事。《斯韦特兰娜》（«Светлана»）把可怕经历写成梦（сон），女主人公醒来后与平安归来的新郎结婚。", "课件 04 · 第 12、14、16 页"], ["善恶、选择与天意", "课件认为，茹科夫斯基谣曲中的人自己在善（добро）与恶（зло）之间作出选择。《斯韦特兰娜》结尾强调对天意（Провидение）的信赖：噩梦结束后，幸福随着醒来出现。", "课件 04 · 第 14、16 页"]]], ["05", "格里鲍耶多夫与《聪明误》", "亚历山大·谢尔盖耶维奇·格里鲍耶多夫（Александр Сергеевич Грибоедов）的喜剧《聪明误》（«Горе от ума»）将爱情情节和社会冲突交织在一起。", [["爱情情节与社会冲突", "主要爱情三角（любовный треугольник）包括亚历山大·安德烈耶维奇·恰茨基（Александр Андреевич Чацкий）、索菲娅·帕夫洛芙娜·法穆索娃（Софья Павловна Фамусова）和阿列克谢·斯捷潘诺维奇·莫尔恰林（Алексей Степанович Молчалин）。社会冲突（общественный конфликт）发生在恰茨基与莫斯科社会（московское общество）之间。", "课件 05 · 第 9、10 页"], ["恰茨基、法穆索夫与莫尔恰林", "帕维尔·阿法纳西耶维奇·法穆索夫（Павел Афанасьевич Фамусов）是索菲娅的父亲，维护宗法制贵族的旧秩序（устои патриархального дворянства），是恰茨基的主要思想对手（идейный антагонист）。莫尔恰林的沉默（молчание）与恰茨基的言说（речь）形成对照。", "课件 05 · 第 10、12 页"], ["舞台外人物与戏仿", "舞台外人物（внесценические персонажи）指剧中被提及、却不直接登台的人物；课件认为他们扩大了作品所描绘的社会范围。索菲娅的“梦”（сон Софьи）戏仿浪漫主义叙事谣曲（пародия на романтическую балладу）。戏仿（пародия）是通过模仿某种形式产生讽刺或喜剧效果。", "课件 05 · 第 8、17 页"], ["恰茨基、阿尔塞斯特与普希金", "课件将恰茨基与法国剧作家莫里哀（Мольер）的喜剧《恨世者》（«Мизантроп»）中的阿尔塞斯特（Альцест）比较。亚历山大·谢尔盖耶维奇·普希金（Александр Сергеевич Пушкин）认为恰茨基热情、高尚、善良，却质疑他面对不愿理解自己的听众发表见解是否明智。", "课件 05 · 第 11、14 页"]]], ["06", "普希金：创作的整体脉络", "亚历山大·谢尔盖耶维奇·普希金（Александр Сергеевич Пушкин）的创作包括抒情诗、长诗、戏剧和散文。", [["中学、彼得堡与南方", "皇村中学（Царскосельский лицей）时期的普希金以抒情诗（лирика）为主要线索。彼得堡（Петербург）时期的重要长诗（поэма）是《鲁斯兰与柳德米拉》（«Руслан и Людмила»）。南方流放（южная ссылка）时期创作《高加索的俘虏》（«Кавказский пленник»）、《巴赫奇萨赖的喷泉》（«Бахчисарайский фонтан»），并开始诗体小说（роман в стихах）《叶甫盖尼·奥涅金》（«Евгений Онегин»）。", "课件 06 · 第 2、3 页"], ["米哈伊洛夫斯科耶与博尔季诺", "米哈伊洛夫斯科耶（Михайловское）时期与长诗《茨冈》（«Цыганы»）、悲剧（трагедия）《鲍里斯·戈杜诺夫》（«Борис Годунов»）有关。博尔季诺（Болдино）秋季与《别尔金小说集》（«Повести Белкина»）、《小悲剧》（«маленькие трагедии»）以及《叶甫盖尼·奥涅金》的完成有关。", "课件 06 · 第 3 页"]]], ["07", "普希金：南方长诗与浪漫主义", "浪漫主义（романтизм）重视鲜明的个人情感、自由和理想，与普希金南方时期的多部作品有关。", [["长诗中的人物", "《高加索的俘虏》（«Кавказский пленник»）中的俘虏（Пленник）和切尔克斯姑娘（Черкешенка）没有姓名；《巴赫奇萨赖的喷泉》（«Бахчисарайский фонтан»）中的女主人公是玛丽娅（Мария）和扎列玛（Зарема）；《茨冈》（«Цыганы»）中的主人公是阿列科（Алеко）和泽姆菲拉（Земфира）。", "课件 07 · 第 9、10、16 页"], ["《致大海》", "课件将《致大海》（«К морю»）与普希金告别浪漫主义（прощание с романтизмом）联系起来，并提到英国诗人乔治·戈登·拜伦（Джордж Гордон Байрон）的去世。", "课件 07 · 第 15 页"]]], ["08", "普希金：历史题材与莎士比亚", "历史依据（историческая основа）提供事件材料，文学参照则涉及作品形式与写法。", [["《鲍里斯·戈杜诺夫》", "课件指出，悲剧《鲍里斯·戈杜诺夫》（«Борис Годунов»）的历史依据来自卡拉姆津的《俄罗斯国家史》（«История Государства Российского»）；文学方面借鉴威廉·莎士比亚（Уильям Шекспир）的悲剧和历史剧（исторические хроники）。莫杰斯特·彼得罗维奇·穆索尔斯基（Модест Петрович Мусоргский）后来根据该悲剧创作同名歌剧（опера）。", "课件 08 · 第 4 页"], ["彼得一世题材", "《波尔塔瓦》（«Полтава»）涉及彼得一世（Пётр I）与乌克兰盖特曼伊万·斯捷潘诺维奇·马泽帕（Иван Степанович Мазепа）。盖特曼（гетман）是哥萨克军政首领的称号。《彼得大帝的黑奴》（«Арап Петра Великого»）是未完成的历史小说（неоконченный исторический роман）。", "课件 08 · 第 13、15 页"]]], ["09", "普希金：《别尔金小说集》与小悲剧", "《别尔金小说集》（«Повести Белкина»）和《小悲剧》（«маленькие трагедии»）属于不同体裁的作品组。", [["《别尔金小说集》的五篇作品", "《射击》（«Выстрел»）的主人公是西尔维奥（Сильвио）；《暴风雪》（«Метель»）有玛丽娅·加夫里洛芙娜（Марья Гавриловна）和布尔明（Бурмин）；《棺材匠》（«Гробовщик»）有阿德里安·普罗霍罗夫（Адриан Прохоров）；《驿站长》（«Станционный смотритель»）有萨姆松·维林（Самсон Вырин）和他的女儿冬妮娅（Дуня）；《小姐与女仆》（«Барышня-крестьянка»）有丽莎（Лиза）和阿列克谢·别列斯托夫（Алексей Берестов）。", "课件 09 · 第 5 至 11 页"], ["四部小悲剧", "《吝啬骑士》（«Скупой рыцарь»）、《石客》（«Каменный гость»）、《莫扎特与萨列里》（«Моцарт и Сальери»）和《瘟疫时期的宴会》（«Пир во время чумы»）是课件所列的四部小悲剧。悲剧（трагедия）是表现尖锐冲突的戏剧体裁。", "课件 09 · 第 12 至 15 页"]]], ["10", "普希金：后期创作与国际联系", "普希金的后期创作涉及莎士比亚戏剧、俄罗斯历史和欧洲童话。", [["《安杰洛》与莎士比亚", "长诗《安杰洛》（«Анджело»）的情节取自莎士比亚戏剧《一报还一报》（«Мера за меру»）。课件将这种关系描述为作品情节的改写。", "课件 10 · 第 9 页"], ["普加乔夫起义与渔夫的故事", "普希金研究叶梅利扬·伊万诺维奇·普加乔夫（Емельян Иванович Пугачёв）领导的起义（восстание）。《渔夫和金鱼的故事》（«Сказка о рыбаке и рыбке»）的情节与童话《渔夫和他的妻子》（«О рыбаке и его жене»）有关。", "课件 10 · 第 7、14 页"], ["《黑桃皇后》", "《黑桃皇后》（«Пиковая дама»）是普希金后期的中篇小说（повесть）。课件将它列在第二个博尔季诺秋季（вторая Болдинская осень）的创作中。", "课件 10 · 第 2、11 页"]]]];let seen;try{seen=JSON.parse(localStorage.getItem('kpv3-review-v1'))||{}}catch(e){seen={}}const main=document.querySelector('#main'),jump=document.querySelector('#jump'),progress=document.querySelector('#progress');function el(t,s){let e=document.createElement(t);if(s!==undefined)e.textContent=s;return e}function refresh(){progress.textContent='已读 '+Object.keys(seen).filter(k=>seen[k]).length+' / '+C.length}for(const [id,title,intro,items] of C){jump.add(new Option(id+' '+title,id));let section=el('section');section.className='chapter';section.id='chapter-'+id;let n=el('div',id+' / 课件');n.className='number';section.append(n,el('h2',title),el('p',intro));for(const [heading,body,source] of items){let d=el('details');d.append(el('summary',heading),el('p',body));let ref=el('p',source);ref.className='source';d.append(ref);section.append(d)}let label=el('label');label.className='done';let check=el('input');check.type='checkbox';check.checked=!!seen[id];check.onchange=()=>{if(check.checked)seen[id]=true;else delete seen[id];try{localStorage.setItem('kpv3-review-v1',JSON.stringify(seen))}catch(e){}refresh()};label.append(check,document.createTextNode(' 标记本章已读'));section.append(label);main.append(section)}jump.onchange=()=>{if(jump.value)document.getElementById('chapter-'+jump.value).scrollIntoView({behavior:'auto'})};document.querySelector('#search').oninput=e=>{const term=e.target.value.trim().toLowerCase();let count=0;document.querySelectorAll('.chapter').forEach(section=>{let hit=section.textContent.toLowerCase().includes(term);section.hidden=!hit;if(hit)count++;section.querySelectorAll('details').forEach(d=>{d.hidden=!!term&&!d.textContent.toLowerCase().includes(term)&&!section.querySelector('h2').textContent.toLowerCase().includes(term);if(term&&!d.hidden)d.open=true})});document.querySelector('#empty').classList.toggle('hidden',count>0)};refresh();</script></body></html>
